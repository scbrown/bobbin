[workspace]
changelog_config = "cliff.toml"
publish = false
git_release_enable = true
git_tag_enable = true
# Match the repo's ACTUAL tag convention. release-plz's default
# git tag name for a package is `{{ package }}-v{{ version }}` (=`bobbin-v0.6.3`),
# but every real tag here is `v{{ version }}` (=`v0.6.3`) and release.yml fires
# the binary build on `refs/tags/v*`. With the default, release-plz looked for a
# baseline tag that does not exist, found NO prior release for the package, and
# answered "nothing to release" over real feats — so v0.6.2 and v0.6.3 were both
# hand-cut. Confirmed by mechanism: the post-bootstrap feat run logged
# `release_pr_output: {"prs":[]}` + `nothing to release`. Aligning the template
# to the existing convention (not renaming tags — release.yml depends on `v*`)
# lets release-plz recognize the baseline and open release PRs unaided.
# EXPERIMENT, aegis-pesj — this line is COMMENTED OUT, not deleted, and here is why.
#
# The reasoning above is sound and the defect it names is real. But it did not
# work: ten days on, release-plz still derives NO version bump here. Measured
# across the fleet, `git_tag_name` correlates with failure, inversely and
# exactly:
#
#     repo     crates.io   git_tag_name   bumps?
#     quipu    EXISTS      ABSENT         YES -> 0.3.16
#     bobbin   EXISTS      present        NO
#     hank     ABSENT      present        NO
#
# The only repo WITHOUT the line is the only one that bumps. bobbin vs quipu is
# a clean pair — both have a crates.io package, both publish=false, they differ
# in exactly this line, opposite outcomes. So the line may be ACTIVE HARM rather
# than merely ineffective.
#
# Commented rather than removed so the reasoning survives and the revert is one
# character. ACCEPTANCE: does the next release-plz branch diff touch
# `Cargo.toml` version? quipu's does; bobbin's does not. Readable WITHOUT the
# PR-permission fix, because the branch is pushed either way.
#
# IF THIS SUCCEEDS, do NOT simply re-add the line to fix tag naming: the default
# template is `bobbin-v{{version}}` and release.yml fires on `refs/tags/v*`, so
# the tag shape must then be solved in release.yml, not by restoring the line
# that suppressed the bump.
# git_tag_name = "v{{ version }}"

[[package]]
name = "bobbin"
# The MANIFEST says publish = false (the crates.io "bobbin" is an unrelated
# crate), and release-plz's default is to skip non-published packages entirely
# — its first clean run said "nothing to release" over real unreleased feats.
# release = true says: version it from git tags anyway; that is this repo's
# whole release model (tag -> release.yml -> binaries).
release = true
