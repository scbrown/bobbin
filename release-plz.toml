[workspace]
changelog_config = "cliff.toml"
publish = false
git_release_enable = true
git_tag_enable = true
# Match the repo's ACTUAL tag convention. release-plz's default
# git tag name for a package is `{{ package }}-v{{ version }}` (=`bobbin-v0.6.3`),
# but every real tag here is `v{{ version }}` (=`v0.6.3`) and release.yml fires
# the binary build on `refs/tags/v*`. With the default, release-plz looked for a
# baseline tag that does not exist, found NO prior release for the package, and
# answered "nothing to release" over real feats — so v0.6.2 and v0.6.3 were both
# hand-cut. Confirmed by mechanism: the post-bootstrap feat run logged
# `release_pr_output: {"prs":[]}` + `nothing to release`. Aligning the template
# to the existing convention (not renaming tags — release.yml depends on `v*`)
# lets release-plz recognize the baseline and open release PRs unaided.
# aegis-pesj EXPERIMENT 1, CONCLUDED AND REVERTED. This line was commented out
# to test whether it was SUPPRESSING the version bump (the only repo without it,
# quipu, was the only one bumping). It is not: with it commented, release-plz
# still produced a CHANGELOG-only branch, no bump. The correlation was
# coincidence.
#
# RESTORED because it is correct on its own merits: this repo's tags really are
# `v{{ version }}` and release.yml fires the binary build on `refs/tags/v*`.
# Without it release-plz would tag `bobbin-v0.6.5` the moment it starts working,
# silently breaking the deploy trigger — a latent hazard for no benefit.
#
# What it does NOT do is fix the no-bump defect. Do not read it as that fix.
git_tag_name = "v{{ version }}"

[[package]]
name = "bobbin"
# The MANIFEST says publish = false (the crates.io "bobbin" is an unrelated
# crate), and release-plz's default is to skip non-published packages entirely
# — its first clean run said "nothing to release" over real unreleased feats.
# release = true says: version it from git tags anyway; that is this repo's
# whole release model (tag -> release.yml -> binaries).
#
# EXPERIMENT 2, aegis-pesj — commented out, same protocol as git_tag_name above.
#
# With git_tag_name commented, THIS IS THE ONLY REMAINING DIFFERENCE between
# this config and quipu's, which WORKS. Comments stripped, the two are otherwise
# identical: same [workspace] keys, same [[package]] name key. `release = true`
# is bobbin-only.
#
# And quipu REFUTES the premise this line rests on. The comment above says
# release-plz "skips non-published packages entirely" — but quipu carries
# publish = false with NO `release = true` and derives a real bump (0.3.15 ->
# 0.3.16, Cargo.toml and Cargo.lock both touched). So non-published packages are
# not skipped, and this line may be solving a problem that does not exist.
#
# Four hypotheses already tested and REFUTED on this defect: missing registry
# baseline (bobbin HAS a crates.io entry), ours-vs-stranger registry entry
# (quipu's is a stranger's too — isazajuancarlos/quipu, a crypto codec), tag
# OBJECT TYPE (annotated bobbin fails, annotated quipu works), and git_tag_name
# (experiment 1: commented out, still no bump).
#
# ACCEPTANCE, unchanged: does the next release-plz branch diff touch
# `Cargo.toml` version? Readable without the PR-permission fix.
# A THIRD outcome is possible and is informative, not a failure: if the package
# really is skipped without this line, NO branch appears at all.
# Branch-without-bump and no-branch are different answers.
# release = true
