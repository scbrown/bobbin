[package]
name = "bobbin"
# Release Please manages version bumps and tags without invoking Cargo's
# packaging/publishing path. Safe: the crates.io `bobbin` name is owned by an
# unrelated party, so an accidental `cargo publish` errors on ownership rather
# than leaking anything.
version = "0.7.3"
edition = "2021"
authors = ["Bobbin Team"]
description = "Local-first context injection engine for AI coding agents"
license = "MIT"
repository = "https://github.com/scbrown/bobbin"
homepage = "https://github.com/scbrown/bobbin"
documentation = "https://docs.rs/bobbin"
readme = "README.md"
keywords = ["rag", "code-search", "embeddings", "tree-sitter"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    ".beads/",
    ".runtime/",
    ".claude/",
    ".logs/",
    "docs/tasks/",
    "docs/dev-log.md",
    "mail/",
    "state.json",
    "AGENTS.md",
    "GEMINI.md",
    "PRD.md",
    "VISION.md",
    "justfile",
    "Local RAG and Context Injection.md",
]

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"

# Markdown parsing
pulldown-cmark = "0.12"

# Tree-sitter parsing
async-trait = "0.1"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-cpp = "0.23"

# Vector database (primary storage)
# 0.27 (arrow 57) rather than 0.17 (arrow 53): arrow-array 53.4.1 capped
# chrono at <0.4.40, irreconcilable with quipu's shacl gate (rudof_lib ->
# shapes_converter needs chrono ^0.4.42), and every lancedb before 0.22.3
# pins chrono EXACTLY (=0.4.39 / =0.4.41), which conflicts the same way.
# 0.27 + arrow 57 is the pairing quipu itself builds against, so the two
# stacks stay on one arrow — this bump is what lets `quipu/shacl` compile
# into bobbin at all (it closed bobbin-di7's "missing gate").
lancedb = "0.27"
lance-index = "=4.0.0"
# Cross-process advisory lock for lance maintenance (compact/prune) — already
# in the tree transitively; promoted so the maintenance gate can flock.
fs4 = "0.8"
arrow = { version = "57", default-features = false }
arrow-array = "57"
arrow-schema = "57"

# SQLite (coupling + meta only)
# 0.40 to match quipu's rusqlite: libsqlite3-sys `links = "sqlite3"` allows
# only ONE version in the whole tree, so bobbin and quipu must agree.
rusqlite = { version = "0.40", features = ["bundled"] }

# MySQL/Dolt (beads integration)
mysql_async = { version = "0.34", default-features = false, features = ["default-rustls"] }

# ONNX runtime for embeddings
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["std", "ndarray", "load-dynamic"] }
ndarray = "0.17"
tokenizers = "0.21"

# Error handling
anyhow = "1"
thiserror = "2"

# HTTP client for model downloads
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Utilities
walkdir = "2"
ignore = "0.4"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
indicatif = "0.17"
colored = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
sha2 = "0.10"
notify = "6"
hex = "0.4"
glob = "0.3"

# MCP Server
rmcp = { version = "0.12", features = ["server", "transport-io", "transport-streamable-http-server", "axum"] }
schemars = "1.0"

# Knowledge graph (Quipu subsystem)
#
# rev = 37bfc06a is quipu 0.3.23, current main as of 2026-08-22. The previous pin
# (7f984b4e, 0.2.0) was a deliberate hold: 0.3.x moved `tool_project` to
# `&mut Store` and bobbin passed `&Store` from an immutable borrow. That
# migration is done — the assembler reaches its store through `&mut self`
# (src/search/context.rs run_hybrid_search) and src/search/ppr.rs takes
# `&mut quipu::Store` — so the pin now tracks current main. What the bump
# buys, all verified by tests against an in-process store:
#   - `replace_snapshot` handled server-side (the chunk-push probe in
#     src/knowledge/chunks.rs now passes instead of bailing),
#   - strict /knot `graph` routing (quipu 22b3569) — the quarantine routing
#     probe in src/knowledge/quarantine.rs passes,
#   - graph-scoped SHACL repair context for chunked named-graph writes
#     (quipu-080 / d0c24b7).
#
# Pinned by rev rather than `branch = "main"` so the compiled quipu can never
# drift from the rev this code was adapted to, whatever checkout state CI has.
# With `knowledge` built by CI (bobbin-jdlkh), a floating branch dep would
# break the build the moment quipu's API moved.
#
# LOCKFILE LANDMINE: quipu declares `rudof_lib = "^0.2.8"`, but rudof_lib
# 0.2.9+ moved `validate_shacl` to a builder API that quipu 37bfc06a does not
# compile against, and the rudof workspace crates use loose cross-reqs, so a
# mixed-version rudof family does not compile either. Bobbin's (tracked)
# Cargo.lock therefore pins the WHOLE family to the versions in quipu's own
# Cargo.lock: rudof_lib/rudof_rdf/shacl_ir/shacl_validation/shapes_converter/
# shex_ast/shex_validation/sparql_service/dctap 0.2.8, prefixmap/rudof_generate/
# shacl_ast/shacl_rdf/shapes_comparator 0.2.6, rbe 0.2.7. A bare
# `cargo update` floats them to 0.2.20 and breaks the quipu build; re-pin
# with `cargo update -p <crate> --precise <ver>` per the list above
# (rudof_lib first, then comparator, then the rest).
#
# `default-features = false` keeps quipu's `onnx` OFF — MUST stay off. Verified via
# `cargo tree -i ort`: only bobbin pulls ort/tokenizers, quipu does not, so quipu's
# embedder (and its pad-token bug) is not compiled in.
#
# `features = ["shacl"]` turns write-time validation ON (closes the missing gate
# bobbin-di7): `tool_knot`'s validation is `#[cfg(feature = "shacl")]`, so with
# it off knowledge writes were accepted UNVALIDATED, and a compiled-out gate is
# indistinguishable from a passed one — which is why `knowledge_knot` reports
# `shacl_validated` on every reply. That flag now reports the compiled truth
# (see KNOWLEDGE_SHACL_ENABLED in src/mcp/server.rs). The chrono clash that
# used to forbid this (rudof_lib needed ^0.4.42, arrow-array 53.4.1 capped at
# <0.4.40) was dissolved by the lancedb 0.27 / arrow 57 bump above.
quipu = { version = "=0.3.23", git = "https://github.com/scbrown/quipu", rev = "37bfc06a33081d26177cd7176de45c7cab3647e8", default-features = false, features = ["shacl"], optional = true }

# HTTP Server
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
urlencoding = "2"
pdf-extract = "0.12"

[features]
knowledge = ["dep:quipu"]

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "bobbin"
path = "src/main.rs"
