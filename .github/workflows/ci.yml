name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake g++

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2

      # `knowledge` gates bobbin's entire Quipu integration (MCP surface, coupling
      # exporter, PPR reranking) and is NOT a cargo default feature. CI never passed
      # it, so none of that code was ever compiled here and its tests passed while
      # guarding nothing (bobbin-jdlkh). Build BOTH ways, every time:
      #   --features knowledge  -> the integration is actually compiled + tested
      #   (no features)         -> the default build, incl. the cfg(not(knowledge))
      #                            guard that refuses a PPR request it cannot serve
      # Dropping either arm re-creates the bug: whichever side goes unbuilt goes dark.
      - name: Check (knowledge)
        run: cargo check --features knowledge

      - name: Check (default, no features)
        run: cargo check

      - name: Test (knowledge)
        run: cargo test --features knowledge

      - name: Test (default, no features)
        run: cargo test

      - name: Clippy (knowledge)
        run: cargo clippy --features knowledge

      - name: Clippy (default, no features)
        run: cargo clippy

      # The file-size ratchet ran only from `just check`, i.e. only for whoever
      # remembered to run it. That is how `src/cli/hook.rs` grew 378 lines
      # inside its allowlist entry without a single red build. An allowlist
      # entry is a CEILING now, so the gate has something to enforce — enforce
      # it where nobody can skip it.
      - name: File size ratchet
        run: bash scripts/check-file-size.sh --all

      # A Linux release must become deployable when its own matrix leg finishes;
      # waiting for unrelated macOS legs caused a false deploy page on every
      # slow release (aegis-if8dp).  This is a static workflow contract because
      # the failure is orchestration order, not Rust behavior.
      - name: Release asset publication contract
        run: python3 scripts/test-release-workflow-contract.py

  # The eval framework's own 289 tests were run by NOTHING: `just test` is
  # cargo-only, `just check` does not reach them, and no workflow mentioned
  # them. Sixteen files with a declared pytest dev-dependency and a pyproject,
  # clearly meant to run, silently unexecuted.
  #
  # That matters more than the count. This framework is what measures injection
  # quality — the thing GH#54 proposes to A/B an embedding-model upgrade
  # against. An unrun scorer cannot be trusted to say a change helped, so the
  # measuring instrument needs a gate before the measurements do.
  #
  # Same defect as the file-size ratchet above, one language over: a real check
  # that only ran for whoever remembered to type the command.
  eval-tests:
    name: Eval framework tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Installed explicitly rather than via `pip install -e .[dev]`: the
      # runtime deps include `anthropic`, and the tests neither need it nor
      # should a network-calling client be pulled into a gate that must stay
      # hermetic. matplotlib/pandas are here because test_mpl_charts.py imports
      # them at module scope, so their absence is a collection ERROR that takes
      # the whole run down rather than a skip.
      - name: Install test dependencies
        run: pip install pytest pyyaml click jinja2 matplotlib pandas

      - name: Run eval tests
        working-directory: eval
        run: python -m pytest tests/ scorer/test_scorer.py -q
