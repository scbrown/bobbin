id: pandas-004
repo: pandas-dev/pandas
commit: 17e2d7d82cd6e3c3d14d0c26a0e2728d3a05f1ba
description: |
  Fix read_excel infinite loop when `skiprows` is a callable that returns
  True for all rows. The `_check_skiprows_func` method counts file rows
  until it has accumulated `nrows` non-skipped rows, but if the callable
  skips every row, the loop never terminates. The fix adds a guard: if
  the row counter reaches the Excel maximum row count (1,048,576), the
  method returns None instead of continuing forever.

  In `pandas/io/excel/_base.py`, add an `EXCEL_ROWS_MAX = 1_048_576`
  constant and modify `_check_skiprows_func` to return None when `i`
  reaches that limit. Update the return type annotation to `int | None`.
  The calling code in `_calc_rows` already handles None correctly.
setup_command: |-
  python3 -m venv .venv && .venv/bin/pip install --quiet --upgrade pip && D=$(git log -1 --format=%cI HEAD) && .venv/bin/python -c "import tomllib; print(chr(10).join(tomllib.load(open('pyproject.toml','rb'))['build-system']['requires']))" > .venv/build-requires.txt && .venv/bin/pip install --quiet --uploaded-prior-to "$D" ninja setuptools tzdata pytest-timeout -r .venv/build-requires.txt && PATH="$PWD/.venv/bin:$PATH" .venv/bin/pip install --quiet --uploaded-prior-to "$D" --no-build-isolation -e '.[test,excel]'
test_command: ".venv/bin/pytest pandas/tests/io/excel/test_readers.py -x -k test_read_excel_skiprows_callable_all -p timeout --timeout=60"
language: python
difficulty: easy
tags: [bug-fix, io-excel, infinite-loop, read-excel]
