repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.17.2
    hooks:
      - id: markdownlint-cli2

  # GATE THE FORMATTER. Without this, `cargo fmt` was a trap rather than a
  # courtesy: the tree was not fmt-clean, so running the formatter reformatted
  # most of it and pushed two untouched files over the file-size limit — a
  # contributor doing the tidy thing broke a gate in files they never opened.
  # quipu and yupana both gate fmt; bobbin did not, which is why the drift
  # accumulated silently. (bobbin-qd4)
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --check
        language: system
        types: [rust]
        pass_filenames: false
